<html>
    <head>
        <title>calculator</title>
        <link rel="stylesheet" href="calcstyle.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1></h1>
        <div class="rows">
            <h1 style="text-align: center;color:rgb(10, 54, 211);">Calculator</h1>
           <input type="text" class="input">
            <div class="row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
            </div>
            <div class="row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>
            <div class="row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>x</button>
            </div>
            <div class="row">
                <button>=</button>
                 <button>C</button>
                 <button>0</button>
                 <button>/</button>
            </div>
        </div>
        <script src="calc.js"></script>
    </body>
</html>
